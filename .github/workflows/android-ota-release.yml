name: Build Winanp APK & Publish OTA Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.WINANP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > winanp-release.jks
          else
            echo "::warning::Secret WINANP_KEYSTORE_BASE64 belum diset - APK ditandatangani debug key."
          fi

      - name: Build Release APK for Redmi Note 11
        env:
          WINANP_KEYSTORE_PASSWORD: ${{ secrets.WINANP_KEYSTORE_PASSWORD }}
          WINANP_KEY_ALIAS: ${{ secrets.WINANP_KEY_ALIAS }}
          WINANP_KEY_PASSWORD: ${{ secrets.WINANP_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK for OTA Updater
        run: |
          cp app/build/outputs/apk/release/app-release.apk Winanp-RedmiNote11-OTA.apk
          ls -lh Winanp-RedmiNote11-OTA.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winanp-RedmiNote11-OTA
          path: Winanp-RedmiNote11-OTA.apk

      - name: Publish to GitHub Releases (OTA Endpoint)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Winanp-RedmiNote11-OTA.apk
            version.json
          generate_release_notes: true
